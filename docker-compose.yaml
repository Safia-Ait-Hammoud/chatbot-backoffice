services:
  mongodb:
    image: mongo:7
    container_name: backoffice-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backoffice-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: backoffice-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API REST
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backoffice-network

volumes:
  mongodb_data:
  qdrant_data:

networks:
  backoffice-network:
    driver: bridge